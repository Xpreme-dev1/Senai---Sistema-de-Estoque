<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <link rel="stylesheet" href="../css/reset.css"/>
        <link rel="stylesheet" href="../css/color.css"/>
        <link rel="stylesheet" href="../css/cadastroProdutos.css"/>
        <title>Cadastrando Produto</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header id="header">
            <h1 id="tituloDashboard">Sistema de estoque</h1>
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="gerenciamento.html">Gerenciamento</a></li>
                    <li><a href="cadastro.html">Usuários</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section id="form-container">
                <h2>Novo Produto</h2>
                <form action="../cadastroProdutos" method="POST" id="formCadastro">
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label>Código de Barras</label>
                            <input type="text" name="codigoBarras" required />
                        </div>
                        <div class="grupo-form">
                            <label>Nome do produto</label>
                            <input type="text" name="nomeProduto" required />
                        </div>
                    </div>
                    
                    <div class="linha-form">
                        <div class="grupo-form">
                            <label>Fabricante</label>
                            <input type="text" name="fabricante" required />
                        </div>
                        <div class="grupo-form">
                            <label>Marca</label>
                            <input type="text" name="marca" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label>Data de Fabricação</label>
                            <input type="date" name="dataFabricacao" required />
                        </div>
                        <div class="grupo-form">
                            <label>Data de Vencimento</label>
                            <input type="date" name="dataVencimento" required />
                        </div>
                    </div>

                    <div class="linha-form">
                         <div class="grupo-form">
                            <label>Quantidade</label>
                            <input type="number" name="quantidade" id="quantidade" required />
                         </div>
                         <div class="grupo-form">
                            <label>Valor Unitário</label>
                            <input type="number" step="0.01" name="valor" id="valor" required />
                         </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label>Valor Total</label>
                            <input type="number" step="0.01" name="total" id="total" required />
                        </div>
                        <div class="grupo-form">
                            <label>Estoque Mínimo</label>
                            <input type="number" name="estoqueMinimo" value="0" required />
                        </div>
                    </div>

                    <div class="linha-form">
                        <div class="grupo-form">
                            <label>Local/Prateleira</label>
                            <input type="text" name="localArmazenamento" placeholder="Ex: Prateleira A1" />
                        </div>
                    </div>

                    <input type="hidden" name="status" value="Disponível">
                    
                    <div class="acoes-form">
                        <a href="dashboard.html" class="btn-cancelar">Cancelar</a>
                        <button type="submit" class="btn-salvar">Salvar Produto</button>
                    </div>
                </form>
            </section>
        </main>
        <script src="../js/cadastroProdutos.js"></script>
    </body>
</html>
